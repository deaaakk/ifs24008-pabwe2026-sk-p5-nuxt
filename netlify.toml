[build]
  command = "npm run build"
  publish = "dist"

# Proxy API ke Delcom (setara rewrite di vercel.json)
[[redirects]]
  from = "/api/*"
  to = "https://open-api.delcom.org/api/v1/:splat"
  status = 200
  force = true

# SPA fallback: semua path lain dilayani index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200